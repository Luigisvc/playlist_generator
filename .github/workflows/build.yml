name: Build e Publicar Release

on:
  push:
    tags:
      - 'v*' # Dispara automaticamente quando você publicar uma versão (ex: v1.0.0)
  workflow_dispatch: # Também permite rodar manualmente na aba Actions

permissions:
  contents: write # Necessário para o GitHub Actions criar a Release e anexar os arquivos

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar biblioteca grafica (Apenas Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0

      - name: Instalar dependencias e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar Executavel
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "NavidromePlaylistGenerator" main.py

      - name: Preparar arquivo Linux (.tar.gz com permissao)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf NavidromePlaylistGenerator-Linux.tar.gz NavidromePlaylistGenerator
          rm NavidromePlaylistGenerator

      - name: Renomear arquivo Windows
        if: runner.os == 'Windows'
        run: |
          mv dist/NavidromePlaylistGenerator.exe dist/NavidromePlaylistGenerator-Windows.exe

      - name: Salvar arquivos temporarios
        uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ runner.os }}
          path: dist/*

  release:
    needs: build # Só roda depois que Windows e Linux terminarem com sucesso
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Baixar executaveis gerados
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Criar Release Publica no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true # Gera a lista de mudanças automaticamente
